<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Secret Diary</title>
    <link rel="stylesheet" href="diary1.css">
</head>

<body>

    <div class="container">

        <h1>📖 My Secret Diary</h1>

        <!-- Create Password -->
        <div id="createBox">
            <h2>Create New Password 🔐</h2>

            <input type="password"
                   id="newPassword"
                   placeholder="Create password">

            <input type="password"
                   id="confirmPassword"
                   placeholder="Confirm password">

            <button onclick="createPassword()">
                Create Password
            </button>

            <p id="createMessage"></p>
        </div>

        <!-- Login -->
        <div id="loginBox" style="display: none;">
            <h2>🔒 Unlock Your Diary</h2>

            <input type="password"
                   id="loginPassword"
                   placeholder="Enter your password">

            <button onclick="login()">
                Unlock Diary
            </button>

            <p id="loginMessage"></p>
        </div>

        <!-- Diary -->
        <div id="diaryBox" style="display: none;">
            <h2>💜 Welcome to Your Diary</h2>

            <textarea id="diaryText"
                      placeholder="Write your secret thoughts here..."></textarea>

            <br>

            <button onclick="saveDiary()">
                💾 Save Diary
            </button>

            <button onclick="changePassword()">
                🔑 Change Password
            </button>

            <button onclick="lockDiary()">
                🔒 Lock Diary
            </button>

            <p id="saveMessage"></p>
        </div>

    </div>

    <script src="diary1.js"></script>

</body>
</html>
