<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Diary 🔐</title>
  <link rel="stylesheet" href="diary.css">
</head>

<body>

  <!-- Password Screen -->
  <div id="loginScreen" class="screen">
    <div class="login-box">
      <div class="lock">🔐</div>
      <h1>Secret Diary</h1>
      <p>Enter your password to continue</p>

      <input
        type="password"
        id="passwordInput"
        placeholder="Enter password"
        autocomplete="current-password"
      >

      <button onclick="login()">Unlock Diary</button>

      <p id="loginMessage"></p>
    </div>
  </div>

  <!-- Diary Screen -->
  <div id="diaryScreen" class="hidden">

    <header>
      <h1>📖 My Secret Diary</h1>
      <button class="logout-btn" onclick="logout()">🔒 Lock</button>
    </header>

    <main>

      <section class="write-box">
        <h2>✍️ Write a New Entry</h2>

        <input type="date" id="date">

        <input
          type="text"
          id="title"
          placeholder="Entry title..."
        >

        <textarea
          id="entry"
          placeholder="Write your secret thoughts here..."
        ></textarea>

        <button onclick="saveEntry()">💾 Save Entry</button>
      </section>

      <section>
        <h2 class="entries-title">📚 My Entries</h2>
        <div id="entries"></div>
      </section>

    </main>

  </div>

  <script src="diary.js"></script>
</body>
</html>
